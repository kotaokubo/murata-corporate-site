# 必須チェック「scope」「staging-verified」「codex-review」。
# pull_request_target で動かすので、チェックの定義とスクリプトは常に main 側のものが使われる。
# PR の中でこのファイルや scripts/ を書き換えても、そのPRのチェックには効かない（AI がチェックを緩めて通すことを防ぐ）。
# ただし、区分 C を変えてよい人（大久保と招待された人）は、このファイルを変える PR を main に入れられる。その後の PR には効かない。
# 注意：PR 側のコードは一切実行しない（git の差分を見るだけ）。npm ci やビルドをここに足さないこと
name: guard

on:
  pull_request_target:
    branches: [main, staging]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

# チェックの結果は「コミット × チェック名」で1つしか残らない。staging 向けと main 向けの PR が同じコミットを指すと、
# あとから走った方の結果で上書きされる（staging 向けの skipped で、main 向けの staging-verified の失敗が消えていた）。
# そこで staging 向けの PR では、名前の末尾に「 (staging)」を付けて、main の必須チェックと別のものとして記録する。
jobs:
  scope:
    name: ${{ github.base_ref == 'main' && 'scope' || 'scope (staging)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main, persist-credentials: false }
      - name: PR の変更を取ってくる（実行はしない）
        run: git fetch origin "pull/${{ github.event.pull_request.number }}/head"
      - run: node scripts/check-scope.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

  # staging 向けの PR では確かめることがないので、すぐ成功で終える。
  # ジョブごと飛ばす（if）と skipped が記録され、GitHub は必須チェックの skipped を成功と扱うので、そうしない
  staging-verified:
    name: ${{ github.base_ref == 'main' && 'staging-verified' || 'staging-verified (staging)' }}
    runs-on: ubuntu-latest
    steps:
      - if: github.base_ref != 'main'
        run: echo "staging 向けの PR なので確かめない"
      - if: github.base_ref == 'main'
        uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main, persist-credentials: false }
      - name: PR の変更と staging を取ってくる（実行はしない）
        if: github.base_ref == 'main'
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/head"
          git fetch origin staging
      - if: github.base_ref == 'main'
        run: node scripts/check-staging-verified.mjs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

  # Codex のレビューが最新のコミットに付いているか（付くまで最大25分待つ）
  codex-review:
    name: ${{ github.base_ref == 'main' && 'codex-review' || 'codex-review (staging)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - run: node scripts/check-codex-review.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
