wholesale:
  eyebrow: BUSINESS FLOW
  title: 宝飾品の輸入・卸売
  intro: |
    確かな品質を見極め、選び、つくる。
    一貫したものづくりで、世代を超えて受け継がれるジュエリーをお届けします。
  body: |
    国内外から厳選したダイヤモンド、カラーストーン、パールなど、上質な宝飾品を幅広く取り揃え、全国の宝飾小売店様へお届けしています。
    長年培ってきた仕入れネットワークと確かな目利きを活かし、品質にこだわった商品を選定。価値ある商品をご提案しています。
    一つひとつのジュエリーに込められた魅力を、その先のお客様へ。
    長く愛され、世代を超えて受け継がれるジュエリーをお届けすることを大切にしています。
