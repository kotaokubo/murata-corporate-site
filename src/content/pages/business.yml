    - en: 01 SOURCING
      ja: 仕入れ
    - en: 02 QUALITY CHECK
      ja: 品質チェック
    - en: 03 CRAFTING
      ja: 製作
    - en: 04 WHOLESALE
      ja: 卸売
    - en: 05 PROCESSING
      ja: 加工
    - en: 06 DELIVERY
      ja: 納品
  slides:
    - caption: ダイヤモンドリング - 厳選された最高品質のダイヤモンドを使用
    - caption: パールネックレス - 上質な真珠を一粒一粒丁寧にセレクト
    - caption: カラーストーンブレスレット - 世界各地から集めた希少石
    - caption: ルースコレクション - 幅広い石目をご用意
  sp:
