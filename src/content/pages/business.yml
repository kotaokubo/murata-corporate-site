repair:
  eyebrow: REPAIR
  title: 修理・加工
  body: |
    お客様の大切なジュエリーを、熟練の職人が一点一点丁寧に修理・加工いたします。
    「購入したお店が閉店してしまった」「他店で断られた」
    そんなお困りごとも、お気軽にご相談ください。

    サイズ直し／新品仕上げ／石留め／チェーン切れ・ブレス修理／組替え・糸替え／文字入れ・文字消し／ピアス・イヤリング加工／リングの変形・歪み修正／リメイク等

    思い出の詰まったジュエリーを次の世代へ。
    お預かりからお届けまで、責任を持って対応いたします。
  slides:
    - caption: ロジウムメッキ加工
    - caption: レーザー溶接
