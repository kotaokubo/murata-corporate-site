philosophy:
  eyebrow: PHILOSOPHY
  title: Corporate Philosophy
  headline: Connecting love through partnership
  body: As the foremost partner for everyone—including our staff, partners, and customers—we connect craftsmanship and sincerity to our customers and contribute to the future of the industry.

message:
  eyebrow: MESSAGE
  title: Message from the President
  body: |
    Since our founding in 1979, Murata Jewelry has delivered jewelry to jewelry retailers nationwide from our base in Matsuyama, Ehime, guided by the philosophy of being “the foremost partner for our customers.”

    Drawing on solid craftsmanship and our own sourcing network, we deliver one by one, with care, unique jewelry where artisan handwork meets materials of the highest quality.

    As a Jewelry Concierge, we will continue to offer radiance and value loved across generations.
  role: President and Representative Director
  name: Koichiro Murata

