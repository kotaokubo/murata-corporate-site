flow:
  eyebrow: FLOW
  title: Steps to starting a partnership
  lead: Please feel free to contact us first. We will guide you step by step from hearing your needs through proposals and meetings.
  steps:
    - number: "01"
      title: Inquiry
      body: We hear about your store situation and needs by phone or email.
    - number: "02"
      title: Hearing
      body: We organize the sales floor, customer profile, preferred conditions, and align on direction.
    - number: "03"
      title: Proposal / Meeting
      body: We propose products, pricing, and introduction methods, and proceed with discussions on terms and content.
    - number: "04"
      title: Partnership begins
      body: After the partnership begins, we support business growth with ongoing proposals and service.

