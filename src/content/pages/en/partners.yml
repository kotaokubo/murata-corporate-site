intro:
  title: |
    From sourcing to production, processing, delivery, and aftercare.
    A “Jewelry Concierge” that stands beside your business.
  body: Since our founding in 1979, Murata Jewelry has supported jewelry retailers, specialty stores, and corporate customers nationwide with a solid sourcing network and the craftsmanship of our own atelier. Beyond product sourcing, we respond one-stop to diverse jewelry needs—from design planning and OEM to advanced processing, repair, and remodeling.
  ctaBusiness: View Our Business
  ctaContact: Inquire about a new partnership
  sp:
    title: A Jewelry Concierge that stands with you end to end—from sourcing to aftercare
    body: Since our founding in 1979, Murata Jewelry has continued to support retailers nationwide with our own sourcing network and the specialized craftsmanship of our in-house atelier. We provide consistent, high-level support for sourcing, original CAD design production, and aftercare. As a close “Jewelry Partner” for every retailer and corporate customer, we walk alongside you.

reasons:
  eyebrow: 4 REASONS
  title: Four reasons Murata Jewelry is chosen
  sp:
    eyebrow: STRENGTHS
    title: Four reasons we are chosen
  items:
    - number: "01"
      title: A rich assortment with high freshness
      body: From classic staple designs to the latest collections that reflect ever-changing contemporary trends, we offer a rich lineup. We can flexibly propose assortments matched to seasonal displays and your customer base.
      sp:
        body: We propose a wide range from classic staples to trend designs. Flexible lineups matched to the season are possible.
    - number: "02"
      title: Sourcing and development through our own network
      body: We have built strong sourcing routes in Japan and abroad, and GIA (Gemological Institute of America) qualified staff carefully select high-quality stones with a discerning eye. On the foundation of strong material sourcing power, we continually develop new products that lead the times.
      sp:
        title: An integrated system from material sourcing to product development
        body: Reliable quality carefully selected and sourced by GIA-qualified staff. Active original development that makes full use of our network.
    - number: "03"
      title: Integrated processing and repair in our own atelier
      body: Beyond sourcing and production, having our own atelier is our greatest strength. From demanding sizing, like-new finishing, and remodeling to complex stone-setting repairs, in-house craftspeople respond accurately and promptly.
      sp:
        title: Fast repair and processing in our own atelier
        body: From sizing, like-new finishing, and remodeling to complex processing, dedicated in-house artisans provide consistent support.
    - number: "04"
      title: Optimal proposals tailored to stores and customers
      body: We do not offer one-size-fits-all products. We customize optimal purchase volumes, price ranges, and event co-sponsorship proposals through consultation, matched to each retailer’s customer base, store position, and trade area.
      sp:
        title: Proposals optimized for your store
        body: We can consult individually on purchase mix and event collaboration that fit the customer base and average spend your store serves best.

