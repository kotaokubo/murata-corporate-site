repair:
  eyebrow: REPAIR
  title: Repair & Processing
  body: |
    Skilled artisans carefully repair and process each of your treasured pieces of jewelry one by one.
    “The shop where I bought it has closed.” “Another store turned me down.”
    Please feel free to consult us about such concerns as well.

    Sizing / like-new finishing / stone setting / broken chains & bracelet repair / restringing / engraving & removing engraving / earring conversion / correcting ring deformation & distortion / remakes, and more

    Passing jewelry filled with memories on to the next generation.
    From intake to delivery, we take responsibility for every step.
  slides:
    - caption: Rhodium plating
    - caption: Laser welding
  sp:
    lead: Skilled artisans carefully repair and process each of your treasured pieces of jewelry one by one. “The shop where I bought it has closed.” “Another store turned me down.” Please feel free to consult us about such concerns as well.
    services: Sizing / like-new finishing / stone setting / broken chains & bracelet repair / restringing / engraving & removing engraving / earring conversion / remodeling
    closing: |
      Passing jewelry filled with memories on to the next generation.
      From intake to delivery, we take responsibility for every step.
    slides:
      - caption: Rhodium plating
      - caption: Precision laser welding

