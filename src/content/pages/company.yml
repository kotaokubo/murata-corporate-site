philosophy:
  eyebrow: PHILOSOPHY
  title: 企業理念
  headline: パートナーシップで愛をつなぐ
  body: スタッフ・協力先・得意先を含めた皆様にとって「一番のパートナー」として、職人の技と真心をお客様に繋ぎ、業界の未来に貢献していきます。

message:
  eyebrow: MESSAGE
  title: 代表挨拶
  body: |
    昭和54年の創業以来、村田宝飾は「お客様にとって一番のパートナー」であることを理念に、愛媛県松山市を拠点として全国の宝飾小売店様にジュエリーをお届けしてまいりました。

    確かな技術と独自の仕入れネットワークを強みに、職人の手仕事と最高品質の素材が融合した唯一無二の宝飾品を一つひとつ想いを込めてお届けしています。

    これからもジュエリーコンシェルジュとして、世代を超えて愛される輝きと価値を提供し続けてまいります。
  role: 代表取締役社長
  name: 村田 康一郎

