intro:
  eyebrow: OUR HISTORY
  title: 沿革
  body: |
    1979年の創業以来、村田宝飾は宝飾品の製造卸として、歩みを重ねてまいりました。
    愛媛県松山市という豊かな自然と歴史に育まれた地から、全国へ、そして世界へ——。
    四国の展示会から始まった商いは、東京・御徒町への進出、業界初のISO9001取得、自社工房とオンラインショップの開設という節目を経て、今日に至ります。時代の移り変わりとともに歩んできた軌跡をご紹介いたします。
  sp:
    eyebrow: OUR HISTORY
    body: |
      1979年の創業以来、村田宝飾は宝飾品の製造卸として歩みを重ねてまいりました。
      愛媛県松山市という豊かな自然と歴史に育まれた地から、全国へ、そして世界へ——。
      四国の展示会から始まった商いは、東京・御徒町への進出、業界初のISO9001取得、自社工房とオンラインショップの開設という節目を経て、今日に至ります。時代の移り変わりとともに歩んできた村田宝飾の歴史をご紹介いたします。

timeline:
  - date: 1979年
    text: 愛媛県松山市立花において村田宝飾 株式会社設立（資本金1,000万円）
  - date: 1983年4月
    text: 総合展示会「燦きのフェアー」開催
  - date: 1995年3月
    text: 「燦きのフェアー」から「燦美展」と名称変更、四国主要都市9会場にて開催
    sp:
      text: 「燦きのフェアー」から「燦美展」と名称変更、四国主要都市9会場で開催
  - date: 1995年4月
    text: 松山市朝生田に本社移転
  - date: 1997年10月
    text: バンコクに現地法人「Santamates Gem」設立
  - date: 1999年4月
    text: 松山市中村に新社屋完成
  - date: 1999年12月
    text: 創業20周年記念パーティー開催
  - date: 2001年4月
    text: 東京支店を御徒町に開設、ジュエリータウン御徒町に加入しJTO出展
  - date: 2002年7月
    text: 村田康一郎、社長就任
  - date: 2004年12月
    text: 業界初ISO9001取得。
  - date: 2005年10月
    text: 東京支店を東京本社に組織変更
  - date: 2006年4月
    text: 甲府支店を開設
  - date: 2012年2月
    text: 東京本社、拡張移転
  - date: 2015年11月
    text: 本社加工部にレーザー溶接機を導入
  - date: 2015年12月
    text: 宝飾市場活性化を目的とした「We Love Jewelry」の啓蒙活動を開始
  - date: 2016年3月
    text: 資本金を3,000万円に増資
  - date: 2016年5月
    text: 本社加工部に3D CADと3Dプリンタを導入
  - date: 2016年8月
    text: 銀行保証付私募債（発行額1億円）を発行
  - date: 2016年9月
    text: 本社製作部門拡大に伴い工房社屋を新設／移転
  - date: 2018年3月
    text: 東京本社を御徒町新社屋に移転
  - date: 2018年11月
    text: 村田寶飾香港有限公司設立
  - date: 2020年3月
    text: 村田寶飾香港有限公司閉鎖
  - date: 2020年4月
    text: 宝飾小売店向け会員制オンラインショップ「The Jewelry Concierge」設立
    sp:
      text: 宝飾小売店向けオンラインショップ「The Jewelry Concierge」を設立
  - date: 2023年1月
    text: SDG'sに伴うサスティナブルな会社を目指し本社屋に太陽光システムを導入

