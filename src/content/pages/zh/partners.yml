intro:
  title: |
    从采购到制作、加工、交货、售后护理。
    贴近事业的「珠宝礼宾」。
  body: 村田宝饰自1979年创业以来，以可靠的采购网络与自社工房技术为优势，支持全国的珠宝零售店、专卖店与法人客户。不仅是商品采购，从设计企划与OEM到高度的加工・修理・改造，对珠宝相关的多样咨询提供一站式对应。
  ctaBusiness: 查看业务内容
  ctaContact: 咨询新交易
  sp:
    title: 从采购到售后支持一贯贴近的珠宝礼宾
    body: 村田宝饰自1979年创业以来，以独有的采购网络与社内工房的专业技术，持续支持全国零售店。以高水平一贯支持采购、CAD原创设计制作、售后护理。作为所有零售店・法人客户身边的「珠宝伙伴」并肩前行。

reasons:
  eyebrow: 4 REASONS
  title: 村田宝饰被选择的4个理由
  sp:
    eyebrow: STRENGTHS
    title: 被选择的4个理由
  items:
    - number: "01"
      title: 丰富且鲜度高的品类
      body: 从经典定番设计到反映不断变化的现代潮流的最新系列，备货丰富。可配合季节陈列与客群，灵活提出产品线。
      sp:
        body: 从经典定番到潮流设计，广泛提出方案。可配合季节灵活调整产品线。
    - number: "02"
      title: 依托独有网络的采购与开发
      body: 在国内外建立稳固的采购渠道，由GIA（美国宝石学会）有资格者凭借可靠的审美眼严选高品质宝石。以强大的素材采购力为基础，持续进行引领时代的新品开发。
      sp:
        title: 从素材采购到商品开发的一贯体制
        body: 由GIA有资格者亲自严选采购的安心品质。活用网络的最新原创开发也很活跃。
    - number: "03"
      title: 自社工房的一贯加工与修理
      body: 不仅是采购与制作，拥有自社工房是最大优势。从难度高的改尺寸、如新抛光、改造到复杂镶石修理，社内工匠准确且迅速地对应。
      sp:
        title: 自社工房的迅速修理加工
        body: 从改尺寸、如新抛光、改造到复杂加工，由自社专任工匠在社内一贯支持。
    - number: "04"
      title: 贴近店铺与顾客的最优提案
      body: 我们不做单纯划一的商品提供。配合各零售店的客群、店铺定位与商圈，就最优采购量、价格带、展销协赞提案等反复商量并定制。
      sp:
        title: 为店铺优化的提案
        body: 可个别咨询契合零售店擅长客群与客单价的采购构成及展销合作体制。

consultations:
  eyebrow: CONSULTATIONS
  title: 可对应的咨询
  items:
    - en: SUPPLY & SELECTION
      title: 定番・潮流商品的采购
      bullets:
        - 钻石・珍珠・各类彩色宝石的定番珠宝
        - 从潮流休闲珠宝到正式场合的庄重作品
        - 库存补充、客群更换时的产品线重建咨询
      sp:
        en: SUPPLY
        title: 定番・潮流采购
        bullets:
          - 钻石・珍珠等定番
          - 从休闲到正式高级作品
          - 店铺产品线的更新
    - en: ORIGINAL & OEM
      title: 原创・OEM制作
      bullets:
        - 活用3DCAD的自有品牌珠宝设计开发
        - 从3D打印机精密树脂原型制作到样品确认
        - 量产橡胶模具制作，从小批量到大批量由自社工房一贯支持
      sp:
        en: OEM
        title: 原创・OEM
        bullets:
          - 活用3DCAD的原创设计
          - 精密树脂样品的制作・确认
          - 从小批量到大批量的量产体制
    - en: EXHIBITION & EVENTS
      title: 面向展销・展会的商品
      bullets:
        - 面向零售店特别展会与限定活动的委托・采购支援
        - 吸引顾客目光的高单价稀有珠宝与孤品的特别选定
        - 与活动促销工具和陈列联动的卖场企划协助
      sp:
        en: EVENTS
        title: 展销・展会商品
        bullets:
          - 店铺限定活动的委托・采购
          - 作为视觉焦点的高单价稀有珠宝
          - 卖场演出的企划合作
    - en: AFTERCARE & REPAIR
      title: 修理・改造・售后护理
      bullets:
        - 顾客委托的珍贵戒指改尺寸、歪斜修正
        - 项链链条断裂、珍珠重新串线、抛光至如新状态
        - 从珍贵遗物等珠宝到现代设计的改造提案
      sp:
        en: REPAIR
        title: 加工・修理・改造
        bullets:
          - 迅速的改尺寸・歪斜修正
          - 项链珍珠重新串线・如新抛光
          - 将珍贵物品改造成新设计

flow:
  eyebrow: FLOW
  title: 开始交易前的流程
  lead: 请先随时联系我们。从听取需求到提案、洽谈，我们按步骤引导。
  steps:
    - number: "01"
      title: 咨询
      body: 通过电话・邮件了解店铺情况与需求。
    - number: "02"
      title: 听取需求
      body: 整理卖场、顾客画像、希望条件等，对齐方向。
    - number: "03"
      title: 提案／洽谈
      body: 提出商品・价格・导入方法，并就条件与内容推进洽谈。
    - number: "04"
      title: 开始交易
      body: 交易开始后，通过持续提案与对应支援事业成长。

