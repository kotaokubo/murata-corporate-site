philosophy:
  eyebrow: PHILOSOPHY
  title: 企业理念
  headline: 以伙伴关系连接爱
  body: 作为包括员工、合作方与客户在内的各位“最重要的伙伴”，我们将工匠技艺与真心传达给顾客，为行业的未来做出贡献。

message:
  eyebrow: MESSAGE
  title: 代表致辞
  body: |
    自1979年创业以来，村田宝饰以“成为客户最重要的伙伴”为理念，以爱媛县松山市为据点，向全国的珠宝零售店提供珠宝。

    以扎实的技术与独有的采购网络为优势，我们将工匠的手工与最高品质素材相融合的独一无二的珠宝，一件一件倾注心意地送达。

    今后也将作为珠宝礼宾，持续提供跨越世代仍被珍爱的光辉与价值。
  role: 代表董事社长
  name: 村田 康一郎

