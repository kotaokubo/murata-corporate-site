ourBusiness:
  eyebrow: OUR BUSINESS
  title: 購入からアフターケアまで、すべてお任せください。
  body: |
    村田宝飾は宝飾品の卸売を中心に、オリジナルジュエリーの製作から修理・リフォームまで、
    一気通貫でサポートいたします。

    当社の強みは「材料調達力」「新商品開発力」「自社工房による加工力」「幅広い品揃え力」「商品鮮度力」です。
    5つの強みを活かし、お客様のあらゆるニーズにお応えします。どんなことでもお気軽にご相談ください。
  ctaLabel: 詳しく見る >
  steps:
    - en: 01 SOURCING
      ja: 仕入れ
    - en: 02 QUALITY CHECK
      ja: 品質チェック
    - en: 03 CRAFTING
      ja: 製作
    - en: 04 WHOLESALE
      ja: 卸売
    - en: 05 PROCESSING
      ja: 加工
    - en: 06 DELIVERY
      ja: 納品
  sp:
    title: |
      購入からアフターケアまで、
      すべてお任せください。

