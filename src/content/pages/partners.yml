# 新規お取引をご検討の方へ（区分 A）
meta:
  title: 新規お取引をご検討の方へ
  description: 仕入れから製作、加工、納品、アフターケアまで。村田宝飾は事業に寄り添うジュエリーコンシェルジュです。

pageHero:
  eyebrow: PARTNERSHIP
  title: 新規お取引をご検討の方へ
  sp:
    title: 新規お取引について

intro:
  title: |
    仕入れから製作、加工、納品、アフターケアまで。
    事業に寄り添う「ジュエリーコンシェルジュ」。
  body: 村田宝飾は、昭和54年の創業以来、確かな仕入れネットワークと自社工房の技術を強みに、全国の宝飾小売店・専門店・法人のお客様を支えてきました。商品の仕入れはもちろん、デザイン企画やOEM、高度な加工・修理・リフォームまで、ジュエリーに関する多様なご相談にワンストップでお応えします。
  ctaBusiness: 事業内容を見る
  ctaContact: 新規取引について相談する
  sp:
    title: 仕入れからアフターサポートまで一気通貫で寄り添うジュエリーコンシェルジュ
    body: 村田宝飾は、昭和54年の創業以来、独自の仕入れネットワークと社内工房の専門技術で、全国の小売店様を支え続けてきました。仕入れ、CADオリジナルデザイン製作、アフターケアを高いレベルで一貫サポート。すべての小売店・法人様の身近な「ジュエリーパートナー」として伴走します。

reasons:
  eyebrow: 4 REASONS
  title: 村田宝飾が選ばれる4つの理由
  sp:
    eyebrow: STRENGTHS
    title: 選ばれる4つの理由
  items:
    - number: "01"
      title: 豊富で鮮度の高い品揃え
      body: 定番のクラシックデザインから、常に変化する現代のトレンドを反映した最旬のコレクションまで豊富にご用意。季節のディスプレイや客層に合わせて、柔軟にラインナップをご提案可能です。
      sp:
        body: クラシック定番からトレンドデザインまで幅広くご提案。季節に合わせた柔軟なラインナップが可能です。
    - number: "02"
      title: 独自ネットワークによる調達と開発
      body: 国内外に強固な仕入れルートを築き、GIA（米国宝石学会）有資格者が確かな審美眼で高品質な石を厳選。高い素材調達力をベースに、時代をリードする新商品の開発を継続的に行っています。
      sp:
        title: 素材調達から商品開発の一貫体制
        body: GIA有資格者が自ら厳選調達した安心品質。ネットワークを駆使した最新のオリジナル開発も活発です。
    - number: "03"
      title: 自社工房による一貫した加工・修理
      body: 仕入れや製作だけでなく、自社工房を構えていることが最大の強み。難易度の高いサイズ直し、新品仕上げ、リフォーム、複雑な石留め修理まで、社内クラフトマンが正確かつ迅速に対応します。
      sp:
        title: 自社工房による迅速な修理加工
        body: サイズ直し、新品仕上げ、リフォーム、複雑な加工まで自社専任の職人が社内で一貫サポートします。
    - number: "04"
      title: 店舗と顧客に寄り添う最適提案
      body: 私たちは単なる画一的な商品の提供は行いません。個々の小売店様の客層や店舗の立ち位置、商圏にあわせて最適な仕入れ量、価格帯、催事への協賛提案まで相談を重ねながらカスタマイズします。
      sp:
        title: 店舗に最適化したご提案
        body: 小売店様の得意な客層や客単価にフィットする仕入れ構成や催事の協力体制を個別にご相談可能です。

consultations:
  eyebrow: CONSULTATIONS
  title: 対応できるご相談
  items:
    - en: SUPPLY & SELECTION
      title: 定番・トレンド商品の仕入れ
      bullets:
        - ダイヤモンド・パール・各種カラーストーンの定番ジュエリー
        - トレンドのカジュアルジュエリーから格式あるフォーマルピースまで
        - 在庫補充、客層入れ替え時のラインナップ再構築のご相談
      sp:
        en: SUPPLY
        title: 定番・トレンド仕入れ
        bullets:
          - ダイヤモンド・パール等の定番
          - カジュアルから本格高級ピースまで
          - 店舗ラインナップのアップデート
    - en: ORIGINAL & OEM
      title: オリジナル・OEM製作
      bullets:
        - 3DCADを活用した独自ブランドのジュエリーデザイン開発
        - 3Dプリンターによる精密な樹脂原型作成からサンプル確認
        - 量産ゴム型の製作、小ロット・大ロットまで自社工房が一貫サポート
      sp:
        en: OEM
        title: オリジナル・OEM
        bullets:
          - 3DCADを活用した独自デザイン
          - 精密な樹脂サンプルの作成・確認
          - 小ロットから大ロット量産体制
    - en: EXHIBITION & EVENTS
      title: 催事・展示会向け商品
      bullets:
        - 小売店様の特別展示会や限定イベント向けの委託・仕入れ支援
        - お客様の目を惹く高単価希少ジュエルや一点物の特別選定
        - イベント販促ツールやディスプレイに連動した売場企画のお手伝い
      sp:
        en: EVENTS
        title: 催事・展示会商品
        bullets:
          - 店舗限定イベントの委託・仕入れ
          - アイキャッチとなる高単価希少ジュエル
          - 売場演出のプランニング協力
    - en: AFTERCARE & REPAIR
      title: 修理・リフォーム・アフターケア
      bullets:
        - お客様からお預かりした大切なリングのサイズ直し、歪み補正
        - ネックレスのチェーン切れ、真珠の糸替え、新品同様にするポリッシュ仕上げ
        - 大切な形見などのジュエリーから現代的デザインへのリメイク提案
      sp:
        en: REPAIR
        title: 加工・修理・リフォーム
        bullets:
          - 迅速なサイズ直し・歪み修正
          - ネックレス真珠糸替え・新品仕上げ
          - 大切な品を新デザインへリメイク

flow:
  eyebrow: FLOW
  title: 取引開始までの流れ
  lead: まずは気軽にお問い合わせください。ヒアリングからご提案、商談まで、順を追ってご案内します。
  steps:
    - number: "01"
      title: お問い合わせ
      body: 電話・メールで、店舗状況やご要望をご伺います。
    - number: "02"
      title: ヒアリング
      body: 売場、顧客像、希望条件などを整理し、方向性をすり合わせます。
    - number: "03"
      title: ご提案／商談
      body: 商品・価格・導入方法をご提案し、条件や内容について商談を進めます。
    - number: "04"
      title: お取引開始
      body: 取引開始後は、継続的な提案や対応で事業成長を支援します。

faq:
  eyebrow: FAQ
  title: よくあるご質問
  items:
    - question: 新規取引を検討していますが、まずどのように相談すればよいですか？
      answer: まずはお電話またはお問い合わせフォームよりお気軽にご連絡ください。卸取引のアカウント登録手順や商品構成、条件等をヒアリングの上、担当のコンシェルジュが最適プランをご案内いたします。
    - question: 仕入れる前に、商品を実際に目で見て確認することは可能ですか？
      answer: ''
    - question: オリジナルジュエリー製作（OEM）のロットや価格はどうなっていますか？
      answer: ''
    - question: 他店で購入された品のアフターサービスや修理も対応できますか？
      answer: ''
