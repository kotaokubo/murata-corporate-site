# 採用情報（区分 A：事務の方が承認なしで直せる）
meta:
  title: 採用情報
  description: 村田宝飾の採用情報です。社員インタビュー・採用フロー・募集要項をご案内します。

hero:
  eyebrow: RECRUIT
  title: 採用情報

message:
  eyebrow: RECRUIT MESSAGE
  title: We are Jewelry Concierge.
  headline: |
    共に歩み、共に輝きを届ける。
    そんな仲間を探しています。
  body1: |
    村田宝飾は昭和54年の創業以来、愛媛県松山市を拠点に、全国の宝飾小売店様へ厳選されたジュエリーをお届けしてまいりました。
    スタッフ・協力先・得意先を含めたすべての皆様にとっての「一番のパートナー」であること——それが私たちの変わらぬ信念です。一人ひとりが誇りを持ち、幸せを実感できる環境を、共に育んでいます。
  body2: |
    お客様に寄り添う「ジュエリーコンシェルジュ」として、世代を超えて愛される輝きを届け続ける。伝統を守りながらも、新しい感性を歓迎する風土がここにはあります。
    宝石という特別な世界で、あなたの力を活かしてみませんか。
  ctaRequirements: 募集要項を見る >
  ctaEntry: エントリーフォーム >
  sp:
    title: 私たちの想い
    headline: あなたの輝きを、ここから。
    body1: |
      村田宝飾は昭和54年の創業以来、愛媛県松山市を拠点に、全国の宝飾売店様へ厳選されたジュエリーをお届けしてまいりました。

      スタッフ・協力先・得意先を含めたすべての皆様にとっての「一番のパートナー」であること——それが私たちの変わらぬ信念です。一人ひとりが誇りを持ち、幸福を感じられる環境を、共に育んでいます。
    body2: |
      お客様に寄り添う「ジュエリーコンシェルジュ」として、世代を超えて愛される輝きを届け続ける。
      伝統を守りながらも、新しい感性を歓迎する風土がここにはあります。

      宝石の世界で、あなたの力を活かしてみませんか。

staffInterview:
  eyebrow: STAFF INTERVIEW
  title: 社員インタビュー
  items:
    - role: フロアスタッフ
      name: 大本 早也佳
      sections:
        - |
          ■ 入社のきっかけ
          元々宝飾に興味があり、表に立つよりも裏でサポートする事が得意だったので、フロアスタッフとして自分の得意分野を活かせる会社だと思い入社しました。営業のサポート、お客様からのお問い合わせの対応など、日々新しい事を学べるので入って良かったと実感しています。
        - |
          ■ 嬉しかったエピソード
          入社して2年目の時、お客様からリフォームの依頼を受け、データ作製から行い、1ヵ月以上お客様と試行錯誤しました。
          完成品がお客様の手元に渡った後、感謝のお手紙を頂いた時は大変嬉しかったです。
      message: |
        ■ 一言メッセージ
        業界未経験で入社し、最初は不安な事も多かったですが、宝飾について学ぶ機会も多く、先輩方も優しく教えて下さるので不安もすぐに無くなりました！自分がやりたいことをサポートしてくれるので、何でもチャレンジできます☆
      spBody: |
        ■ 入社のきっかけ
        元々宝飾に興味があり、表に立つよりも裏でサポートする事が得意だったので、フロアスタッフとして自分の得意分野を活かせる会社だと思い入社しました。営業のサポート、お客様からのお問い合わせの対応など、日々新しい事を学べるので入って良かったと実感しています。

        ■ 嬉しかったエピソード
        入社して2年目の時、お客様からリフォームの依頼を受け、データ作製から行い、1ヵ月以上お客様と試行錯誤しました。完成品がお客様の手元に渡った後、感謝のお手紙を頂いた時は大変嬉しかったです。

        ■ 一言メッセージ
        業界未経験で入社し、最初は不安な事も多かったですが、宝飾について学ぶ機会も多く、先輩方も優しく教えて下さるので不安もすぐに無くなりました！自分がやりたいことをサポートしてくれるので、何でもチャレンジできます☆
    - role: セールススタッフ
      name: 坂本 訓仁
      sections:
        - |
          ■ 仕事について
          四国、山陰、兵庫エリアを中心に月12日前後の営業活動を行っています。百貨店内や路面店など、様々な小売店様を訪問する中で、沢山の方々と接する機会があります。お客様との関係づくりや、商品を提案して売れた時にやりがいと成長を感じます。
        - |
          ■ 嬉しかったエピソード
          上司から担当を引き継いで一人で営業を始めた頃は多くの不安を抱えていました。加工やリフォームの相談でも分からないことだらけでしたが、事務に確認するとすぐに教えていただき、その場で回答できるようになりました。繰り返すうちに「すぐ対応してくれてありがたい」「勧めた商品が売れました」とお声をいただくように。あたふたしながら必死に対応する姿を温かく見守ってくださった小売店様や、事務の迅速なバックアップに支えられて成長できたと感じています。
      message: |
        ■ 一言メッセージ
        中途採用で旅館業から転職しましたが、営業未経験でも楽しく仕事ができているのは、社内の雰囲気の良さと自身の「誠実さ」のおかげだと思っています。それが人との関わりの多い営業面でとても支えになっています。まずは気になったとか、宝石が好きとか、少しでも前向きな気持ちがあれば気軽に応募してみてください。私たちがサポートします。
      spBody: |
        ■ 仕事について
        四国、山陰、兵庫エリアを中心に月12日前後の営業活動を行っています。百貨店内や路面店など、様々な小売店様を訪問する中で、沢山の方々と接する機会があります。お客様との関係づくりや、商品を提案して売れた時にやりがいと成長を感じます。

        ■ 嬉しかったエピソード
        上司から担当を引き継いで一人で営業を始めた頃は多くの不安を抱えていました。加工やリフォームの相談でも分からないことだらけでしたが、事務に確認するとすぐに教えていただき、その場で回答できるようになりました。繰り返すうちに「すぐ対応してくれてありがたい」「勧めた商品が売れました」とお声をいただくように。あたふたしながら必死に対応する姿を温かく見守ってくださった小売店様や、事務の迅速なバックアップに支えられて成長できたと感じています。

        ■ 一言メッセージ
        中途採用で旅館業から転職しましたが、営業未経験でも楽しく仕事ができているのは、社内の雰囲気の良さと自身の「誠実さ」のおかげだと思っています。まずは気になったとか、宝石が好きとか、少しでも前向きな気持ちがあれば気軽に応募してみてください。私たちがサポートします。
    - role: 工房スタッフ
      name: マンダル アマル
      sections:
        - |
          ■ 入社のきっかけ
          インド・カルカッタ出身、31歳。日本に初めて来ました。
          日本の冬がとても寒いのですが、皆さん暖かく支えてもらっているので嬉しく思います。
          日本の高い加工技術を学びたいと思い、村田宝飾に入社しました。
        - |
          ■ 一言メッセージ
          仕事が大好きで毎日勉強になります。
          私のように海外出身の社員でも、皆さんがとても親切に指導してくださるので安心してください。
      message: ''
      spBody: |
        ■ 入社のきっかけ
        インド・カルカッタ出身、31歳。日本に初めて来ました。日本の冬がとても寒いのですが、皆さん暖かく支えてもらっているので嬉しく思います。日本の高い加工技術を学びたいと思い、村田宝飾に入社しました。

        ■ 一言メッセージ
        仕事が大好きで毎日勉強になります。私のように海外出身の社員でも、皆さんがとても親切に指導してくださるので安心してください。

